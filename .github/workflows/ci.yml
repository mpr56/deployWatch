name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deploywatch
          POSTGRES_PASSWORD: deploywatch
          POSTGRES_DB: retention_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U deploywatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: deploywatch
      TEST_DATABASE_URL: postgresql+psycopg://deploywatch:deploywatch@localhost:5433/retention_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt pytest
      - name: Apply migrations
        run: |
          for f in api/migrations/*.sql; do
            psql -h localhost -p 5433 -U deploywatch -d retention_test -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Test
        working-directory: api
        run: python -m pytest tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
