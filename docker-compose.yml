services:
  db:
    image: postgres:17-alpine
    container_name: deploywatch-db
    environment:
      POSTGRES_USER: deploywatch
      POSTGRES_PASSWORD: deploywatch
      POSTGRES_DB: deploywatch
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploywatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  # v2: alert emails land here instead of the real internet.
  # Web UI on http://localhost:8025, SMTP on 1025.
  mail:
    image: axllent/mailpit:latest
    container_name: deploywatch-mail
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  dbdata:
